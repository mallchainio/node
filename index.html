<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节点鸭 NodeDuck</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    font-family: Arial, "Microsoft YaHei", sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f5f7fb;
}

.box {
    width: 90%;
    max-width: 420px;
    padding: 40px 25px;
    background: #ffffff;
    border-radius: 16px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
    width: 90px;
    height: 90px;
    margin: 0 auto 25px;
    border-radius: 20px;
    background: #ffd43b;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 36px;
}

.title {
    font-size: 22px;
    font-weight: bold;
    color: #222;
    margin-bottom: 15px;
}

.text {
    font-size: 16px;
    color: #666;
    line-height: 1.8;
}

.tip {
    margin-top: 25px;
    padding: 12px;
    background: #f7f8fa;
    border-radius: 10px;
    color: #888;
    font-size: 14px;
}

@media(max-width:480px){
    .box {
        padding: 35px 20px;
    }

    .title {
        font-size: 20px;
    }

    .text {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        🦆
    </div>

    <div class="title">
        节点鸭社区
    </div>

    <div class="text">
        请使用 节点鸭社区APP 访问
    </div>

    <div class="tip">
    <a href="https://error.nodeduck.com/nodeduck.apk" style="color:#1677ff;text-decoration:none;">
        去下载app
    </a>
    </div>

</div>

</body>
</html>
