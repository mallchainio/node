<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIP 限制 - 无法观看</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 24px;
    }

    .icon-wrap {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .icon-wrap svg {
      width: 56px;
      height: 56px;
      stroke: #e94560;
    }

    h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 1px;
    }

    .msg-primary {
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
      margin-bottom: 8px;
      text-align: center;
      line-height: 1.6;
    }

    .msg-secondary {
      color: rgba(255, 255, 255, 0.5);
      font-size: 14px;
      margin-bottom: 36px;
      text-align: center;
      line-height: 1.6;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn-primary {
      width: 100%;
      padding: 14px 0;
      border-radius: 8px;
      border: none;
      background: linear-gradient(90deg, #e94560, #ff6b6b);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      width: 100%;
      padding: 14px 0;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: transparent;
      color: rgba(255, 255, 255, 0.8);
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .footer {
      color: rgba(255, 255, 255, 0.3);
      font-size: 12px;
      margin-top: 40px;
      text-align: center;
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      h1 {
        font-size: 22px;
      }

      .icon-wrap {
        width: 96px;
        height: 96px;
      }

      .icon-wrap svg {
        width: 44px;
        height: 44px;
      }

      .msg-primary {
        font-size: 15px;
      }

      .msg-secondary {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      <line x1="12" y1="15" x2="12" y2="17"></line>
    </svg>
  </div>

  <h1>会员专属内容</h1>
  <p class="msg-primary">对不起，你不是 VIP 会员</p>
  <p class="msg-secondary">无法观看 VIP 影片，开通会员后即可畅享海量高清内容</p>


  <p class="footer">如有疑问请联系社区客服</p>
</body>
</html>
