<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>视频播放器</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

.page {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #242424 0,
            #101010 35%,
            #080808 70%
        );
}


/* 顶部 */

.topbar {
    height: 58px;

    padding: 0 14px;

    display: flex;
    align-items: center;

    background: rgba(10,10,10,.9);

    border-bottom:
        1px solid rgba(255,255,255,.06);

    backdrop-filter: blur(15px);
}

.back {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,.08);

    color: #fff;

    font-size: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.title {
    flex: 1;

    margin-left: 11px;

    font-size: 16px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* 播放器 */

.player-wrap {
    width: 100%;

    background: #000;
}

.player {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;
}

#video {
    width: 100%;
    height: 100%;

    display: block;

    background: #000;
}


/* 内容 */

.content {
    padding: 20px 16px 40px;

    max-width: 900px;

    margin: 0 auto;
}

.video-title {
    font-size: 21px;

    font-weight: 700;

    line-height: 1.4;
}

.meta {
    margin-top: 8px;

    color: #888;

    font-size: 12px;
}


/* URL输入 */

.url-box {
    margin-top: 18px;

    display: flex;

    gap: 8px;
}

.url-input {
    flex: 1;

    min-width: 0;

    height: 44px;

    padding: 0 13px;

    border: 1px solid rgba(255,255,255,.1);

    border-radius: 8px;

    outline: none;

    background: #151515;

    color: #fff;

    font-size: 13px;
}

.url-input::placeholder {
    color: #666;
}

.url-input:focus {
    border-color: rgba(255,255,255,.3);
}

.play-btn {
    flex: 0 0 auto;

    height: 44px;

    padding: 0 20px;

    border: 0;

    border-radius: 8px;

    background: #fff;

    color: #000;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;
}

.play-btn:active {
    transform: scale(.97);
}


/* 状态 */

.info {
    margin-top: 14px;

    padding: 13px 14px;

    border-radius: 9px;

    background: rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.05);

    color: #888;

    font-size: 12px;

    line-height: 1.6;
}


/* PC */

@media (min-width: 768px) {

    .topbar {
        padding: 0 25px;
    }

    .player {
        max-width: 1100px;

        margin: auto;
    }

    .content {
        padding-left: 25px;
        padding-right: 25px;
    }

}
</style>
</head>

<body>

<div class="page">

    <!-- 顶部 -->

    <div class="topbar">

        <button
            class="back"
            onclick="history.back()">

            ‹

        </button>

        <div
            class="title"
            id="title">

            视频播放器

        </div>

    </div>


    <!-- 播放器 -->

    <div class="player-wrap">

        <div class="player">

            <video
                id="video"
                controls
                playsinline
                webkit-playsinline
                x5-playsinline
                x5-video-player-type="h5"
                x5-video-player-fullscreen="true">
            </video>

        </div>

    </div>


    <!-- 内容 -->

    <div class="content">

        <div
            class="video-title"
            id="videoTitle">

            在线视频

        </div>

        <div class="meta">
            支持 M3U8 / MP4 / WebM 等格式
        </div>


        <!-- URL -->

        <div class="url-box">

            <input
                type="text"
                id="urlInput"
                class="url-input"
                placeholder="请输入视频 URL"
                autocomplete="off">

            <button
                class="play-btn"
                onclick="startPlay()">

                ▶ 播放

            </button>

        </div>


        <!-- 状态 -->

        <div
            class="info"
            id="status">

            请输入视频地址后点击播放

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

var hls = null;


/*
 * 播放视频
 */

function playVideo(url) {

    var video =
        document.getElementById('video');

    var status =
        document.getElementById('status');


    if (!url) {

        status.innerText =
            '请输入视频地址';

        return;

    }


    /*
     * 清理之前的 HLS
     */

    if (hls) {

        try {

            hls.destroy();

        } catch (e) {}

        hls = null;

    }


    /*
     * 清理旧视频
     */

    video.pause();

    video.removeAttribute('src');

    video.load();


    status.innerText =
        '正在连接视频...';


    /*
     * HLS.js
     *
     * 不判断 .m3u8
     *
     * gs.php?id=1 也可以
     */

    if (
        typeof Hls !== 'undefined' &&
        Hls.isSupported()
    ) {

        hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30

            });


        hls.attachMedia(video);


        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            function () {

                hls.loadSource(url);

            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                status.innerText =
                    '视频已准备好';

                video.play().catch(
                    function () {}
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function (
                event,
                data
            ) {

                console.log(
                    'HLS错误:',
                    data
                );


                if (data.fatal) {

                    /*
                     * HLS失败
                     * 尝试原生 video
                     */

                    try {

                        hls.destroy();

                    } catch (e) {}

                    hls = null;


                    video.src = url;

                    video.load();

                    video.play().catch(
                        function () {}
                    );

                }

            }
        );

    }


    /*
     * Safari / iOS 原生 HLS
     */

    else if (
        video.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        video.src = url;

        video.addEventListener(
            'loadedmetadata',
            function onLoaded() {

                video.removeEventListener(
                    'loadedmetadata',
                    onLoaded
                );

                status.innerText =
                    '视频已准备好';

                video.play().catch(
                    function () {}
                );

            }
        );

    }


    /*
     * 其他格式
     */

    else {

        video.src = url;

        video.load();

        video.play().catch(
            function () {}
        );

    }


    /*
     * 视频错误
     */

    video.addEventListener(
        'error',
        function () {

            if (video.error) {

                status.innerText =
                    '视频加载失败，请检查 URL';

            }

        }
    );

}


/*
 * 点击播放
 */

function startPlay() {

    var input =
        document.getElementById('urlInput');

    var url =
        input.value.trim();

    playVideo(url);

}


/*
 * 回车播放
 */

document
.getElementById('urlInput')
.addEventListener(
    'keydown',
    function (e) {

        if (e.key === 'Enter') {

            startPlay();

        }

    }
);


/*
 * 如果 URL 参数存在
 *
 * 自动播放
 *
 * play.html?url=xxx
 */

(function () {

    var params =
        new URLSearchParams(
            window.location.search
        );

    var url =
        params.get('url');

    var name =
        params.get('title');


    if (url) {

        var input =
            document.getElementById(
                'urlInput'
            );

        input.value = url;


        if (name) {

            try {

                name =
                    decodeURIComponent(name);

            } catch (e) {}

            document.getElementById(
                'title'
            ).innerText = name;

            document.getElementById(
                'videoTitle'
            ).innerText = name;

            document.title = name;

        }


        playVideo(url);

    }

})();

</script>

</body>
</html>
