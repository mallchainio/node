<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>视频播放器</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    min-height: 100vh;
}

.page {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 0%,
            #242424 0,
            #101010 35%,
            #080808 70%
        );
}


/* 顶部 */

.topbar {
    height: 58px;

    padding: 0 14px;

    display: flex;
    align-items: center;

    background: rgba(10,10,10,.9);

    border-bottom:
        1px solid rgba(255,255,255,.06);

    backdrop-filter: blur(15px);
}

.back {
    width: 40px;
    height: 40px;

    border: 0;
    border-radius: 50%;

    background: rgba(255,255,255,.08);

    color: #fff;

    font-size: 28px;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;
}

.title {
    flex: 1;

    margin-left: 11px;

    font-size: 16px;

    font-weight: 600;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* 播放器 */

.player-wrap {
    width: 100%;

    background: #000;
}

.player {
    width: 100%;

    aspect-ratio: 16 / 9;

    background: #000;
}

#video {
    width: 100%;
    height: 100%;

    display: block;

    background: #000;
}


/* 内容 */

.content {
    padding: 20px 16px 40px;

    max-width: 900px;

    margin: 0 auto;
}

.video-title {
    font-size: 21px;

    font-weight: 700;

    line-height: 1.4;
}

.meta {
    margin-top: 8px;

    color: #888;

    font-size: 12px;
}

.info {
    margin-top: 18px;

    padding: 14px;

    border-radius: 9px;

    background: rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.05);

    color: #999;

    font-size: 12px;

    line-height: 1.6;
}


/* PC */

@media (min-width: 768px) {

    .topbar {
        padding: 0 25px;
    }

    .player {
        max-width: 1100px;
        margin: auto;
    }

    .content {
        padding-left: 25px;
        padding-right: 25px;
    }

}
</style>
</head>

<body>

<div class="page">


    <!-- 顶部 -->

    <div class="topbar">

        <button
            class="back"
            onclick="history.back()">

            ‹

        </button>

        <div
            class="title"
            id="title">

            正在播放

        </div>

    </div>


    <!-- 播放器 -->

    <div class="player-wrap">

        <div class="player">

            <video
                id="video"
                controls
                playsinline
                webkit-playsinline
                x5-playsinline
                x5-video-player-type="h5"
                x5-video-player-fullscreen="true">
            </video>

        </div>

    </div>


    <!-- 信息 -->

    <div class="content">

        <div
            class="video-title"
            id="videoTitle">

            正在播放

        </div>

        <div class="meta">
            高清在线播放
        </div>

        <div
            class="info"
            id="status">

            正在连接视频...

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>

(function () {

    var video =
        document.getElementById('video');

    var status =
        document.getElementById('status');

    var title =
        document.getElementById('title');

    var videoTitle =
        document.getElementById('videoTitle');


    /*
     * 获取 URL 参数
     */

    var params =
        new URLSearchParams(
            window.location.search
        );

    var url =
        params.get('url');

    var name =
        params.get('title');


    if (!url) {

        status.innerText =
            '没有找到视频地址';

        return;

    }


    /*
     * 标题
     */

    if (name) {

        title.innerText = name;

        videoTitle.innerText = name;

        document.title = name;

    }


    /*
     * HLS
     *
     * 不判断 .m3u8
     *
     * gs.php?id=1
     * 也可以直接进入这里
     */

    if (
        typeof Hls !== 'undefined' &&
        Hls.isSupported()
    ) {

        var hls =
            new Hls({

                enableWorker: true,

                lowLatencyMode: false,

                backBufferLength: 30

            });


        hls.attachMedia(video);


        hls.on(
            Hls.Events.MEDIA_ATTACHED,
            function () {

                hls.loadSource(url);

            }
        );


        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                status.innerText =
                    '视频已准备好';

                video.play().catch(
                    function () {}
                );

            }
        );


        hls.on(
            Hls.Events.ERROR,
            function (
                event,
                data
            ) {

                console.log(
                    'HLS错误:',
                    data
                );


                if (data.fatal) {

                    /*
                     * HLS失败
                     *
                     * 再尝试浏览器原生播放
                     */

                    hls.destroy();

                    video.src = url;

                    video.load();

                    video.play().catch(
                        function () {}
                    );

                }

            }
        );

    }


    /*
     * Safari / iOS
     */

    else if (
        video.canPlayType(
            'application/vnd.apple.mpegurl'
        )
    ) {

        video.src = url;


        video.addEventListener(
            'loadedmetadata',
            function () {

                status.innerText =
                    '视频已准备好';

                video.play().catch(
                    function () {}
                );

            }
        );

    }


    /*
     * 其他浏览器
     */

    else {

        video.src = url;

        video.load();

        video.play().catch(
            function () {}
        );

    }


    /*
     * 视频错误
     */

    video.addEventListener(
        'error',
        function () {

            status.innerText =
                '视频加载失败';

            console.log(
                'Video Error:',
                video.error
            );

        }
    );

})();

</script>

</body>
</html>
