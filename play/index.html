<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CKPlayer M3U8 播放器</title>
    <link rel="stylesheet" type="text/css" href="css/ckplayer.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 960px;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .input-box {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-box input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #1a1a1a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-box input:focus {
            border-color: #e74c3c;
        }
        .input-box button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            background: #e74c3c;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-box button:hover {
            background: #c0392b;
        }
        .tips {
            margin-top: 15px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }
        .tips code {
            background: #222;
            padding: 2px 6px;
            border-radius: 3px;
            color: #e74c3c;
        }
        .empty-state {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="video-box" id="video"></div>

        <div class="input-box">
            <input type="text" id="urlInput" placeholder="输入 M3U8 视频地址...">
            <button onclick="play()">播放</button>
        </div>

        <div class="tips">
            <p>📌 支持通过 URL 参数传入视频地址：<code>index.html?url=https://xxx.m3u8</code></p>
            <p>📌 支持格式：m3u8 (HLS)、mp4、flv、mpegts 等</p>
        </div>
    </div>

    <script type="text/javascript" src="hls/hls.min.js"></script>
    <script type="text/javascript" src="js/ckplayer.min.js" charset="UTF-8"></script>
    <script>
        var player = null;

        function getQueryParam(name) {
            var urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function playVideo(url) {
            if (!url) return;

            // Update input value
            document.getElementById('urlInput').value = url;

            // Destroy existing player
            if (player) {
                try {
                    player.remove();
                } catch(e) {}
                player = null;
            }

            // Clear container
            var container = document.getElementById('video');
            container.innerHTML = '';

            // Detect video type
            var isM3u8 = /\.m3u8(?:\?|$)/i.test(url);
            var isFlv = /\.flv(?:\?|$)/i.test(url);
            var isMpegts = /\.ts(?:\?|$)/i.test(url);

            var videoObject = {
                container: '#video',
                variable: 'player',
                autoplay: true,
                live: false,
                video: url
            };

            if (isM3u8) {
                videoObject.plug = 'hls.js';
            } else if (isFlv) {
                videoObject.plug = 'flv.js';
            } else if (isMpegts) {
                videoObject.plug = 'mpegts.js';
            }

            player = new ckplayer(videoObject);
        }

        function play() {
            var url = document.getElementById('urlInput').value.trim();
            if (url) {
                // Update URL without reloading
                var newUrl = window.location.pathname + '?url=' + encodeURIComponent(url);
                window.history.replaceState({}, '', newUrl);
                playVideo(url);
            }
        }

        // Auto-play from URL parameter
        var urlParam = getQueryParam('url');
        if (urlParam) {
            playVideo(urlParam);
        } else {
            document.getElementById('video').innerHTML = 
                '<div class="empty-state">请输入视频地址或从 URL 参数传入</div>';
        }

        // Enter key support
        document.getElementById('urlInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') play();
        });
    </script>
</body>
</html>
