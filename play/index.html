<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>影视播放器</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080808;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

.page {
    width: 100%;
    min-height: 100vh;
    background: #080808;
}

/* 顶部 UI */
.topbar {
    height: 58px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    background: #111;
    border-bottom: 1px solid rgba(255,255,255,.06);
}

.back {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: #fff;
    font-size: 27px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

.title {
    flex: 1;
    min-width: 0;
    padding: 0 10px;
}

.title-main {
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.title-sub {
    margin-top: 3px;
    color: #888;
    font-size: 11px;
}

/* 线路按钮 */
.line-btn {
    height: 32px;
    padding: 0 12px;
    border: 0;
    border-radius: 16px;
    background: #252525;
    color: #ddd;
    font-size: 12px;
}

/* 播放器 */
.player-box {
    width: 100%;
    background: #000;
    aspect-ratio: 16 / 9;
    position: relative;
}

#video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

/* 播放器下面 */
.info {
    padding: 16px;
}

.info-title {
    font-size: 18px;
    font-weight: 600;
}

.info-desc {
    margin-top: 7px;
    color: #888;
    font-size: 13px;
}

/* 状态 */
.status {
    margin-top: 14px;
    padding: 11px 13px;
    border-radius: 8px;
    background: #151515;
    color: #999;
    font-size: 12px;
}

.status.ok {
    color: #aaa;
}

/* PC */
@media (min-width: 768px) {

    .page {
        max-width: 1100px;
        margin: 0 auto;
    }

    .topbar {
        height: 64px;
    }

    .player-box {
        max-height: 620px;
    }

}
</style>
</head>

<body>

<div class="page">

    <!-- 顶部 UI -->
    <div class="topbar">

        <button class="back" onclick="history.back()">
            ‹
        </button>

        <div class="title">

            <div class="title-main" id="title">
                正在播放
            </div>

            <div class="title-sub">
                HLS / MP4 播放器
            </div>

        </div>

        <button class="line-btn">
            线路 1
        </button>

    </div>


    <!-- 播放器 -->
    <div class="player-box">

        <video
            id="video"
            controls
            playsinline
            webkit-playsinline
            x5-playsinline
            x5-video-player-type="h5"
            x5-video-player-fullscreen="true">
        </video>

    </div>


    <!-- 信息 -->
    <div class="info">

        <div class="info-title">
            正在播放
        </div>

        <div class="info-desc">
            支持 M3U8、MP4、WebM、OGG
        </div>

        <div class="status" id="status">
            正在加载视频...
        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
(function () {

    var video = document.getElementById('video');
    var status = document.getElementById('status');
    var title = document.getElementById('title');

    var params = new URLSearchParams(window.location.search);

    var url = params.get('url');

    if (!url) {

        status.innerText = '没有找到视频地址';
        return;

    }


    /*
     * URL 参数可以顺便传标题
     *
     * play.html?url=xxx&title=电影名称
     */

    var videoTitle = params.get('title');

    if (videoTitle) {

        title.innerText = videoTitle;

        document.title = videoTitle;

    }


    /*
     * URL 解码
     */

    try {

        url = decodeURIComponent(url);

    } catch (e) {}


    var cleanUrl = url
        .split('?')[0]
        .toLowerCase();


    /*
     * M3U8
     */

    if (
        cleanUrl.indexOf('.m3u8') !== -1 ||
        cleanUrl.indexOf('.m3u') !== -1
    ) {

        if (
            typeof Hls !== 'undefined' &&
            Hls.isSupported()
        ) {

            var hls = new Hls({

                enableWorker: true,

                lowLatencyMode: false

            });

            hls.loadSource(url);

            hls.attachMedia(video);


            hls.on(
                Hls.Events.MANIFEST_PARSED,
                function () {

                    status.innerText = '视频加载完成';

                    status.classList.add('ok');

                    video.play().catch(function () {});

                }
            );


            hls.on(
                Hls.Events.ERROR,
                function (event, data) {

                    console.log(
                        'HLS错误:',
                        data
                    );

                    if (data.fatal) {

                        status.innerText =
                            '视频加载失败，请更换线路或重试';

                    }

                }
            );

        }

        /*
         * Safari 原生 HLS
         */

        else if (
            video.canPlayType(
                'application/vnd.apple.mpegurl'
            )
        ) {

            video.src = url;

            video.addEventListener(
                'loadedmetadata',
                function () {

                    status.innerText =
                        '视频加载完成';

                    video.play().catch(
                        function () {}
                    );

                }
            );

        }

        else {

            status.innerText =
                '当前浏览器不支持 M3U8';

        }

    }


    /*
     * MP4
     */

    else if (
        cleanUrl.indexOf('.mp4') !== -1
    ) {

        video.src = url;

        status.innerText =
            'MP4 视频';

        video.play().catch(
            function () {}
        );

    }


    /*
     * WebM
     */

    else if (
        cleanUrl.indexOf('.webm') !== -1
    ) {

        video.src = url;

        status.innerText =
            'WebM 视频';

        video.play().catch(
            function () {}
        );

    }


    /*
     * OGG
     */

    else if (
        cleanUrl.indexOf('.ogg') !== -1 ||
        cleanUrl.indexOf('.ogv') !== -1
    ) {

        video.src = url;

        status.innerText =
            'OGG 视频';

        video.play().catch(
            function () {}
        );

    }


    /*
     * 未知格式
     */

    else {

        video.src = url;

        status.innerText =
            '正在尝试播放';

        video.play().catch(
            function () {}
        );

    }

})();
</script>

</body>
</html>
